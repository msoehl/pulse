name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Test HealthCore
        run: swift test --package-path Packages/HealthCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Sideloading tools re-sign with your Apple ID but take the entitlements
      # from the binary, so HealthKit must be embedded with a fake signature.
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Pulse.app
          ldid -SApp/Pulse.entitlements "$APP/Pulse"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Pulse.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-ipa
          path: Pulse.ipa
          retention-days: 30
