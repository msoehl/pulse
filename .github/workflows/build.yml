name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 0.1.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Test HealthCore
        run: swift test --package-path Packages/HealthCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Sideloading tools re-sign with your Apple ID but take the entitlements
      # from the binary, so HealthKit must be embedded with a fake signature.
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Pulse.app
          echo "--- Entitlements file ---"
          cat App/Pulse.entitlements
          ldid -SApp/Pulse.entitlements "$APP/Pulse"
          echo "--- Embedded in binary ---"
          ldid -e "$APP/Pulse" | tee embedded.plist
          grep -q "com.apple.developer.healthkit" embedded.plist || { echo "::error::HealthKit entitlement missing from binary"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Pulse.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-ipa
          path: Pulse.ipa
          retention-days: 30

      # Each push to main becomes a release; SideStore reads
      # https://github.com/<repo>/releases/latest/download/source.json
      - name: Create SideStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/make_source.py Pulse.ipa > source.json

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pulse ${{ env.VERSION }}
          body: Automatischer Build von ${{ github.sha }}.
          make_latest: true
          files: |
            Pulse.ipa
            source.json
