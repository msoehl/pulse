name: Shortcut signing test

# Checks whether a CI Mac (not signed in to iCloud) can sign a .shortcut file.
on:
  push:
    paths:
      - .github/workflows/shortcut-sign-test.yml

jobs:
  sign:
    runs-on: macos-15
    steps:
      - name: Create minimal shortcut
        run: |
          cat > test.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>WFWorkflowActions</key>
            <array>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.comment</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFCommentActionText</key>
                  <string>Pulse test</string>
                </dict>
              </dict>
            </array>
            <key>WFWorkflowClientVersion</key>
            <string>2302.0.4</string>
            <key>WFWorkflowIcon</key>
            <dict>
              <key>WFWorkflowIconGlyphNumber</key>
              <integer>59511</integer>
              <key>WFWorkflowIconStartColor</key>
              <integer>4282601983</integer>
            </dict>
            <key>WFWorkflowImportQuestions</key>
            <array/>
            <key>WFWorkflowInputContentItemClasses</key>
            <array/>
            <key>WFWorkflowMinimumClientVersion</key>
            <integer>900</integer>
            <key>WFWorkflowTypes</key>
            <array/>
          </dict>
          </plist>
          EOF
          plutil -convert binary1 test.plist -o test.shortcut
          which shortcuts && sw_vers

      - name: Sign (anyone)
        run: |
          shortcuts sign --mode anyone --input test.shortcut --output signed.shortcut 2>&1 | tee sign.log
          test -s signed.shortcut
          ls -l signed.shortcut
          head -c 4 signed.shortcut | xxd
