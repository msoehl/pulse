name: Pulse
options:
  bundleIdPrefix: de.soehl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HealthCore:
    path: Packages/HealthCore
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HealthCore
      - package: ZIPFoundation
    entitlements:
      path: App/Pulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Pulse liest deine Apple-Health-Daten (Herzfrequenz, HRV, Schlaf, Workouts), um Recovery, Belastung und Schlaf auszuwerten.
        NSHealthUpdateUsageDescription: Pulse schreibt keine Daten in Apple Health.
        UILaunchScreen: {}
        # Lets Pulse appear in the share sheet of the Health export.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Apple Health Export
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, public.xml]
        LSSupportsOpeningDocumentsInPlace: false
        UIRequiredDeviceCapabilities: [healthkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.soehl.pulse
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CI overrides both with the workflow run number.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
